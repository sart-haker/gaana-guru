<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gaana Guru · Guess the Bollywood Song</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <p class="eyebrow">The Bollywood music quiz</p>
  <h1>Gaana <span>Guru</span></h1>
  <div class="tag">Guess the Bollywood song from a 0.5-second clip</div>
</header>

<div class="card">
  <div class="playing-stage">
  <div class="round-content" id="roundContent">
  <div class="controls">
    <label class="filter">
      <span>Era</span>
      <select id="era">
      <option value="any">Any era</option>
      <option value="90s">90s</option>
      <option value="2000s">2000s</option>
      <option value="2010s">2010s</option>
      <option value="2020s">2020s</option>
    </select>
    </label>
    <label class="filter">
      <span>Mood</span>
      <select id="mood">
      <option value="any">Any mood</option>
      <option value="romantic">Romantic</option>
      <option value="party">Party / Dance</option>
      <option value="sad">Soulful</option>
    </select>
    </label>
    <label class="filter">
      <span>Difficulty</span>
      <select id="diff">
      <option value="easy">Easy (iconic)</option>
      <option value="hard">Hard (deep cuts)</option>
    </select>
    </label>
  </div>

  <div class="stages" id="stages"></div>

  <div class="playwrap">
    <button class="bigplay" id="playBtn" aria-label="Play song clip" disabled>▶</button>
    <div id="clipLabel" role="status">Loading your first song…</div>
  </div>

  <div class="search">
    <label for="guess">Name that song</label>
    <input type="text" id="guess" placeholder="Type a song or film title…" autocomplete="off" disabled />
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="row">
    <button id="skipBtn" disabled>Skip</button>
    <button id="retryBtn" hidden>Retry loading</button>
  </div>

  <div class="result" id="result" role="status"></div>
  </div>
  <section class="celebration" id="celebration" aria-labelledby="celebrationHeading" hidden>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="celebration-content">
      <h2 id="celebrationHeading"></h2>
      <div class="cover-frame">
        <span class="cover-fallback" id="coverFallback" role="img" aria-label="Album artwork unavailable">♫</span>
        <img id="songCover" alt="" hidden />
      </div>
      <p class="song-title" id="songTitle"></p>
      <p class="song-details" id="songDetails"></p>
      <p class="round-message" id="roundMessage"></p>
      <button class="primary" id="againBtn">Play again ▶</button>
    </div>
  </section>
  </div>

  <div class="score">
    <div><span>Round score</span><b id="roundScore">—</b></div>
    <div><span>Streak</span><b id="streak">0</b></div>
    <div><span>Total points</span><b id="total">0</b></div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
